defaults: [base]

method: dpo
output_dir: "outputs/dpo"
use_lora: true
qlora: false

beta: 0.1
max_length: 512
max_prompt_length: 256

epochs: 3
batch_size: 2
grad_accum: 4
lr: 1.0e-6
weight_decay: 0.01
warmup_ratio: 0.1

logging_steps: 1
eval_steps: 5
save_steps: 5
eval_strategy: "steps"
save_strategy: "steps"